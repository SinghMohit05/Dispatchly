version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: dispatchly-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dispatchly-net

  postgres:
    image: postgres:16-alpine
    container_name: dispatchly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dispatchly
      POSTGRES_PASSWORD: dispatchly
      POSTGRES_DB: dispatchly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchly"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dispatchly-net

volumes:
  redisdata:
  pgdata:

networks:
  dispatchly-net:
    driver: bridge
